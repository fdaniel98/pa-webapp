name: CI and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Los pull request se verifican, pero no despliegan.
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify:
    name: Typecheck and Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Primero el typecheck: es más rápido y falla antes si algo no compila.
      - name: Typecheck
        run: npm run typecheck

      - name: Run Tests
        run: npm test -- --ci

  deploy:
    name: Deploy
    # Sin verify en verde no se publica nada.
    needs: verify
    if: github.event_name == 'push'
    concurrency:
      group: "pages"
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build
        env:
          # Definir en Settings > Secrets and variables > Actions.
          # Ambas terminan en el bundle público: usa la publishable/anon key, nunca la secret key.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Prepare Pages Output
        run: |
          touch ./build/client/.nojekyll
          cp ./build/client/index.html ./build/client/404.html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './build/client'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
